<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menlo Adventure</title>
<style>
  body {
    margin: 0;
    font-family: 'Courier New', monospace;
    background: radial-gradient(circle at top, #0f172a, #020617);
    color: #e2e8f0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  #game {
    width: 600px;
    max-width: 90%;
    background: rgba(15, 23, 42, 0.9);
    border: 2px solid #38bdf8;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 0 20px rgba(56,189,248,0.5);
  }

  h1 {
    text-align: center;
    color: #38bdf8;
  }

  #story {
    min-height: 120px;
    margin-bottom: 20px;
    line-height: 1.5;
  }

  .choice {
    display: block;
    margin: 8px 0;
    padding: 10px;
    background: #0ea5e9;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    color: white;
    font-size: 16px;
    transition: all 0.2s;
  }

  .choice:hover {
    background: #0284c7;
    transform: scale(1.05);
  }

  #footer {
    margin-top: 10px;
    text-align: center;
    font-size: 12px;
    opacity: 0.6;
  }
</style>
</head>

<body>

<div id="game">
  <h1>🧠 Menlo Adventure</h1>
  <div id="story"></div>
  <div id="choices"></div>
  <div id="footer">Choose wisely. Or don’t. That’s kind of the point.</div>
</div>

<script>
const storyEl = document.getElementById("story");
const choicesEl = document.getElementById("choices");

const game = {
  start: {
    text: "You wake up in Menlo Park. Your phone buzzes. Something big is about to happen.",
    choices: [
      { text: "Check your phone", next: "phone" },
      { text: "Ignore it and walk outside", next: "outside" }
    ]
  },

  phone: {
    text: "It’s a mysterious message: 'You’ve been selected.' No explanation.",
    choices: [
      { text: "Reply: Who is this?", next: "reply" },
      { text: "Delete it", next: "delete" }
    ]
  },

  outside: {
    text: "The air feels different. A black car rolls up slowly beside you.",
    choices: [
      { text: "Get in the car", next: "car" },
      { text: "Run", next: "run" }
    ]
  },

  reply: {
    text: "Three dots appear... then disappear. Your phone dies instantly.",
    choices: [
      { text: "Panic", next: "panic" },
      { text: "Stay calm", next: "calm" }
    ]
  },

  delete: {
    text: "You delete it. Nothing happens. But you can’t shake the feeling you missed something big.",
    choices: [
      { text: "Restart your day", next: "start" }
    ]
  },

  car: {
    text: "Inside, a voice says: 'Good. You chose curiosity.'",
    choices: [
      { text: "Continue", next: "end_good" }
    ]
  },

  run: {
    text: "You run… but trip. The world glitches. This wasn’t real.",
    choices: [
      { text: "Try again", next: "start" }
    ]
  },

  panic: {
    text: "Bad move. Systems don’t like panic.",
    choices: [
      { text: "Restart", next: "start" }
    ]
  },

  calm: {
    text: "Smart. A new message appears: 'We’re watching.'",
    choices: [
      { text: "Continue", next: "end_mystery" }
    ]
  },

  end_good: {
    text: "You’ve entered something bigger than you understand. But you’re in.",
    choices: [
      { text: "Play again", next: "start" }
    ]
  },

  end_mystery: {
    text: "This is just the beginning.",
    choices: [
      { text: "Play again", next: "start" }
    ]
  }
};

function renderScene(sceneKey) {
  const scene = game[sceneKey];
  storyEl.innerText = scene.text;
  choicesEl.innerHTML = "";

  scene.choices.forEach(choice => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerText = choice.text;
    btn.onclick = () => renderScene(choice.next);
    choicesEl.appendChild(btn);
  });
}

renderScene("start");
</script>

</body>
</html>
